<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Restaurant Menu Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
:root {
--bg: #FEF8EC;
--txt: #fff;
--accent: #e67e22;
--sec: #7B2E2F;
}
html, body {
margin: 0 !important;
padding: 0 !important;
width: 100vw;
min-width: 100vw;
max-width: 100vw;
overflow-x: hidden;
box-sizing: border-box;
background: var(--bg);
color: #222;
font-family: system-ui, sans-serif;
}
h1 {
text-align: center;
color: var(--accent);
margin: 1.5rem 0 .5rem 0;
font-family: "Georgia", "Times New Roman", serif;
}
.section-title {
position: sticky;
top: 0;
z-index: 3;
background: var(--bg);
font-size: 1.4rem;
color: var(--sec);
text-align: center;
margin: 2rem 0 1rem 0;
font-weight: 600;
padding: 0.5rem 8px;
border-bottom: 1px solid #e3d2b3;
font-family: "Georgia", "Times New Roman", serif;
box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
}
.subtitle {
font-size: .9rem;
text-align: center;
color: #777;
margin-bottom: 1.5rem;
padding: 0 8px;
}
/* Filter bar */
#filters {
display: flex;
flex-wrap: wrap;
gap: 10px;
justify-content: center;
margin: 1.5rem 0;
padding: 0 8px;
will-change: contents;
transition: opacity 0.2s ease-in-out;
opacity: 1;
}
#filters.updating {
opacity: 0.3;
pointer-events: none;
}
#filters label {
background: #fff;
padding: 6px 12px;
border-radius: 20px;
font-size: .85rem;
box-shadow: 0 1px 3px rgba(0, 0, 0, .1);
cursor: pointer;
user-select: none;
}
#filters input {
margin-right: 5px;
}
/* Grid layout spacing unified */
.grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
gap: 7px;
max-width: 100vw;
margin: 0 auto;
padding: 0 7px 7px 7px;
box-sizing: border-box;
overflow-wrap: break-word;
content-visibility: auto;
contain-intrinsic-size: 210px;
}
/* Menu items */
.item {
position: relative;
width: 100%;
aspect-ratio: 1 / 1;
overflow: visible;
background: var(--bg);
cursor: pointer;
border-radius: 8px;
box-sizing: border-box;
}
.item img {
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
object-fit: cover;
user-select: none;
border: 1px solid #E3D2B3;
border-radius: 8px;
box-sizing: border-box;
transition: border-color 0.2s ease;
}
.item:hover img {
border-color: #d6c39a;
}
/* Title */
.name {
position: absolute;
top: 5px; left: 5px;
color: var(--txt);
background: rgba(145, 100, 50, 0.55);
padding: 3px 9px;
font-weight: 600;
font-size: 1rem;
line-height: 1.3;
z-index: 2;
border-radius: 4px;
pointer-events: none;
display: inline-block;
max-width: calc(100% - 12px);
-webkit-font-smoothing: antialiased;
text-rendering: optimizeLegibility;
text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
white-space: normal;
box-sizing: border-box;
}
/* Subtitle-style description matching title tone */
.overlay {
position: absolute;
left: 0; right: 0; bottom: 0;
color: var(--txt);
background: rgba(145, 100, 50, 0.55);
backdrop-filter: blur(4px);
font-size: 0.95rem;
font-weight: 500;
font-family: "Georgia", "Times New Roman", serif;
text-align: center;
padding: 6px 8px;
z-index: 2;
text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
-webkit-font-smoothing: antialiased;
text-rendering: optimizeLegibility;
border-bottom-left-radius: 8px;
border-bottom-right-radius: 8px;
opacity: 0;
transition: opacity 0.25s ease-out;
box-sizing: border-box;
}
/* Instant appearance, soft disappearance */
.item:hover .overlay {
opacity: 1;
transition: none;
}
.item.show-desc:not(:hover) .overlay {
transition: opacity 0.25s ease-out;
opacity: 0;
}
/* Responsive adjustments */
@media (max-width: 600px) {
.grid {
grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
gap: 6px;
padding: 0 7px 7px 7px;
}
.name {
font-size: 0.95rem;
padding: 3px 7px;
top: 4px;
left: 4px;
max-width: calc(100% - 10px);
}
.overlay {
font-size: 0.9rem;
padding: 5px 7px;
}
#filters, .subtitle, .section-title, h1 {
margin-left: 0 !important;
margin-right: 0 !important;
padding-left: 0 !important;
padding-right: 0 !important;
}
}
/* Missing image placeholder */
.missing {
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
color: #aaa;
font-style: italic;
background: var(--bg);
border-radius: 8px;
border: 1px solid #E3D2B3;
box-sizing: border-box;
}
</style>
</head>
<body>
<h1>Restaurant Menu Gallery</h1>
<p class="subtitle">Tap or hover for description • Filter by tags</p>
<div id="filters"></div>
<div class="section-title">Small Plates & Snacks</div>
<div id="grid1" class="grid" aria-live="polite" aria-relevant="additions"></div>
<div class="section-title">Appetizers</div>
<div id="grid2" class="grid" aria-live="polite" aria-relevant="additions"></div>
<script>
const IMG_FOLDERS = {
small: 'i/01_(16)_Small_Plates_and_Snacks/',
appetizer: 'i/02_(25)_Appetizers/'
};
fetch('menu.json')
.then(resp => resp.json())
.then(data => {
const tagSet = new Set();
data.forEach(o => o.tags.forEach(t => tagSet.add(t)));
const tags = Array.from(tagSet).sort();
const filtersDiv = document.getElementById('filters');
tags.forEach(t => {
const lbl = document.createElement('label');
const cb = document.createElement('input');
cb.type = 'checkbox';
cb.dataset.tag = t;
cb.checked = true;
cb.addEventListener('change', render);
lbl.appendChild(cb);
lbl.appendChild(document.createTextNode(t.charAt(0).toUpperCase() + t.slice(1)));
filtersDiv.appendChild(lbl);
});
function render() {
const hiddenTags = new Set();
filtersDiv.querySelectorAll('input:not(:checked)').forEach(c => hiddenTags.add(c.dataset.tag));
renderGrid('grid1', 'small', hiddenTags);
renderGrid('grid2', 'appetizer', hiddenTags);
setupMobileTap();
}
function renderGrid(gridId, section, hiddenTags) {
const grid = document.getElementById(gridId);
const filteredItems = data.filter(
item => item.section === section && !item.tags.some(t => hiddenTags.has(t))
);
const fragment = document.createDocumentFragment();
filteredItems.forEach(item => {
const div = document.createElement('div');
div.className = 'item';
div.tabIndex = 0;
const img = new Image();
img.alt = prettyName(item.file);
img.src = IMG_FOLDERS[section] + item.file;
img.style.visibility = 'hidden';
img.onload = () => img.style.visibility = 'visible';
img.onerror = () => {
const miss = document.createElement('div');
miss.className = 'missing';
miss.textContent = 'Image missing';
div.appendChild(miss);
};
div.appendChild(img);
const name = document.createElement('div');
name.className = 'name';
name.textContent = prettyName(item.file);
div.appendChild(name);
const overlay = document.createElement('div');
overlay.className = 'overlay';
overlay.textContent = item.desc;
div.appendChild(overlay);
requestAnimationFrame(() => {
const nameRect = name.getBoundingClientRect();
const overlayRect = overlay.getBoundingClientRect();
if (overlayRect.bottom > nameRect.top - 4) {
overlay.style.fontSize = '0.9rem';
}
});
fragment.appendChild(div);
});
grid.replaceChildren(fragment);
}
function setupMobileTap() {
if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
document.querySelectorAll('.item').forEach(el => {
el.removeEventListener('click', el._tapHandler);
el._tapHandler = function(e) {
document.querySelectorAll('.item.show-desc').forEach(card => {
if (card !== el) card.classList.remove('show-desc');
});
el.classList.toggle('show-desc');
};
el.addEventListener('click', el._tapHandler);
});
document.addEventListener('touchstart', e => {
const item = e.target.closest('.item');
if (!item) {
document.querySelectorAll('.item.show-desc').forEach(card => card.classList.remove('show-desc'));
}
});
}
}
function prettyName(fn) {
const small = /^(and|with|of|the|in|on|at|for|a|an|&)$/i;
return fn.replace(/\.[^.]+$/, '')
.replace(/_/g, ' ')
.split(' ')
.map((w, i) =>
i === 0 || !small.test(w)
? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()
: w.toLowerCase())
.join(' ')
.replace(/&/g, '&');
}
render();
})
.catch(e => {
console.error('Failed to load menu.json:', e);
});
</script>
</body>
</html>
