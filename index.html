<style>
  :root{--bg:#fafafa;--txt:#fff;--accent:#e67e22;--sec:#2980b9;}
  body{font-family:system-ui,sans-serif;margin:0;background:var(--bg);color:#222;padding:20px;}
  h1{text-align:center;color:var(--accent);margin:1.5rem 0 .5rem;}
  .section-title{font-size:1.4rem;color:var(--sec);text-align:center;margin:2rem 0 1rem;font-weight:600;}
  .subtitle{font-size:.9rem;text-align:center;color:#777;margin-bottom:1.5rem;}
  #filters{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:1.5rem 0;}
  #filters label{background:#fff;padding:6px 12px;border-radius:20px;font-size:.85rem;
                box-shadow:0 1px 3px rgba(0,0,0,.1);cursor:pointer;user-select:none;}
  #filters input{margin-right:5px;}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0;
    max-width:1400px;margin:auto;
  }
  .item{
    position:relative;overflow:hidden;
    /* Force perfect square */
    width:100%;height:0;padding-bottom:100%;background:#000;
  }
  .item img{
    position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;
  }
  /* Name: always visible at bottom with fade */
  .name{
    position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(transparent,rgba(0,0,0,0.7));
    color:var(--txt);padding:30px 12px 12px;font-weight:600;
    text-align:center;font-size:.95rem;line-height:1.3;
  }
  /* Full description overlay on hover/tap */
  .overlay{
    position:absolute;inset:0;background:rgba(0,0,0,.9);color:var(--txt);
    padding:20px;display:flex;flex-direction:column;justify-content:center;
    align-items:center;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;
  }
  .item:hover .overlay,
  .item.tapped .overlay{opacity:1;pointer-events:auto;}
  .missing{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#aaa;font-style:italic;background:#111;
  }
  @media(max-width:600px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
    .name{font-size:.9rem;padding:24px 10px 10px;}
  }
</style>

<script>
const IMG_FOLDERS = {
  small: 'i/01_(16)_Small_Plates_and_Snacks/',
  appetizer: 'i/02_(25)_Appetizers/'
};

const raw = document.getElementById('data').textContent;
const data = JSON.parse(raw);

/* ---- collect all tags ---- */
const tagSet = new Set();
data.forEach(o => o.tags.forEach(t => tagSet.add(t)));
const tags = Array.from(tagSet).sort();

/* ---- build filters ---- */
const filtersDiv = document.getElementById('filters');
tags.forEach(t => {
  const lbl = document.createElement('label');
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.dataset.tag = t;
  cb.addEventListener('change', render);
  lbl.appendChild(cb);
  lbl.appendChild(document.createTextNode(t.charAt(0).toUpperCase() + t.slice(1)));
  filtersDiv.appendChild(lbl);
});

/* ---- render both grids ---- */
function render() {
  const excluded = new Set();
  filtersDiv.querySelectorAll('input:checked').forEach(c => excluded.add(c.dataset.tag));

  renderGrid('grid1', 'small');
  renderGrid('grid2', 'appetizer');

  function renderGrid(gridId, section) {
    const grid = document.getElementById(gridId);
    grid.innerHTML = '';
    const items = data.filter(o => o.section === section && !o.tags.some(t => excluded.has(t)));

    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'item';

      const img = new Image();
      img.src = IMG_FOLDERS[section] + item.file;
      img.alt = prettyName(item.file);
      img.onload = () => div.appendChild(img);
      img.onerror = () => {
        const miss = document.createElement('div');
        miss.className = 'missing';
        miss.textContent = 'Image missing';
        div.appendChild(miss);
      };

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = prettyName(item.file);

      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.innerHTML = `<strong>${prettyName(item.file)}</strong><br><br>${item.desc}`;

      div.appendChild(name);
      div.appendChild(overlay);
      grid.appendChild(div);
    });
  }

  /* mobile tap */
  if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    document.querySelectorAll('.item').forEach(el => el.addEventListener('click', e => {
      e.preventDefault(); el.classList.toggle('tapped');
    }));
  }
}

/* ---- smart title case ---- */
function prettyName(fn) {
  const small = /^(and|with|of|the|in|on|at|for|a|an|&)$/i;
  return fn.replace(/\.[^.]+$/, '')
           .replace(/_/g, ' ')
           .split(' ')
           .map((w, i) => i === 0 || !small.test(w) ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()
                                                  : w.toLowerCase())
           .join(' ')
           .replace(/&/g, '&');
}

/* initial render */
render();
</script>
