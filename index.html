<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Menu Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --bg: #fafafa;
  --txt: #fff;
  --accent: #e67e22;
  --sec: #2980b9;
}
html, body {
  margin: 0 !important;
  padding: 0 !important;
  width: 100vw;
  min-width: 100vw;
  box-sizing: border-box;
  background: var(--bg);
  color: #222;
}
body {
  font-family: system-ui, sans-serif;
  padding: 0 !important;
  margin: 0 !important;
  width: 100vw;
  min-width: 100vw;
}
h1 {
  text-align: center;
  color: var(--accent);
  margin: 1.5rem 0 .5rem 0;
}
.section-title {
  font-size: 1.4rem;
  color: var(--sec);
  text-align: center;
  margin: 2rem 0 1rem 0;
  font-weight: 600;
}
.subtitle {
  font-size: .9rem;
  text-align: center;
  color: #777;
  margin-bottom: 1.5rem;
}
#filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin: 1.5rem 0;
}
#filters label {
  background: #fff;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: .85rem;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .1);
  cursor: pointer;
  user-select: none;
}
#filters input {
  margin-right: 5px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 0;
  max-width: 100vw;
  margin: 0;
}
.item {
  position: relative;
  width: 100%;
  height: 0;
  padding-bottom: 100%;
  overflow: hidden;
  background: #000;
}
.item img {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  transition: filter 0.3s ease;
}
/* Name: always visible at bottom with fade */
.name {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
  color: var(--txt);
  padding: 30px 12px 12px;
  font-weight: 600;
  text-align: center;
  font-size: .95rem;
  line-height: 1.3;
  z-index: 2;
  pointer-events: none;
}
/* Overlay box: centered, just behind and beneath the text */
.overlay {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  min-width: 60%;
  max-width: 90%;
  padding: 22px 19px;
  border-radius: 18px;
  background: rgba(24,24,24,0.94);
  color: var(--txt);
  font-size: 1.05rem;
  font-weight: 500;
  text-align: center;
  pointer-events: none;
  box-shadow: 0 6px 32px 8px rgba(0,0,0,0.16);
  opacity: 0;
  transition: opacity 0.28s;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: pre-line;
  overflow-wrap: break-word;
}
.item.show-desc .overlay, 
.item:hover .overlay {
  opacity: 1;
  pointer-events: auto;
}
/* Remove default space on smallest screens */
@media (max-width:600px) {
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100vw;
    min-width: 100vw;
    max-width: 100vw !important;
    box-sizing: border-box;
  }
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    max-width: 100vw !important;
    margin: 0 !important;
  }
  #filters, .subtitle, .section-title, h1 {
    margin-left: 0 !important;
    margin-right: 0 !important;
    padding-left: 0 !important;
    padding-right: 0 !important;
  }
  .name {
    font-size: .95rem;
    padding: 24px 8px 10px;
  }
}
.missing {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  font-style: italic;
  background: #111;
}
</style>
</head>
<body>
<h1>Restaurant Menu Gallery</h1>
<p class="subtitle">Tap or hover for description • Filter by tags</p>
<div id="filters"></div>
<div class="section-title">Small Plates & Snacks</div>
<div id="grid1" class="grid"></div>
<div class="section-title">Appetizers</div>
<div id="grid2" class="grid"></div>
<script>
const IMG_FOLDERS = {
  small: 'i/01_(16)_Small_Plates_and_Snacks/',
  appetizer: 'i/02_(25)_Appetizers/'
};

fetch('menu.json')
  .then(r => r.json())
  .then(data => {
    const tagSet = new Set();
    data.forEach(o => o.tags.forEach(t => tagSet.add(t)));
    const tags = Array.from(tagSet).sort();

    const filtersDiv = document.getElementById('filters');
    tags.forEach(t => {
      const lbl = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.dataset.tag = t;
      cb.addEventListener('change', render);
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(t.charAt(0).toUpperCase() + t.slice(1)));
      filtersDiv.appendChild(lbl);
    });

    function render() {
      const excluded = new Set();
      filtersDiv.querySelectorAll('input:checked').forEach(c => excluded.add(c.dataset.tag));
      renderGrid('grid1', 'small');
      renderGrid('grid2', 'appetizer');

      function renderGrid(gridId, section) {
        const grid = document.getElementById(gridId);
        grid.innerHTML = '';
        const items = data.filter(o => o.section === section && !o.tags.some(t => excluded.has(t)));
        items.forEach((item, idx) => {
          const div = document.createElement('div');
          div.className = 'item';
          div.tabIndex = 0;
          const img = new Image();
          img.src = IMG_FOLDERS[section] + item.file;
          img.alt = prettyName(item.file);
          img.onload = () => div.appendChild(img);
          img.onerror = () => {
            const miss = document.createElement('div');
            miss.className = 'missing';
            miss.textContent = 'Image missing';
            div.appendChild(miss);
          };
          const name = document.createElement('div');
          name.className = 'name';
          name.textContent = prettyName(item.file);
          const overlay = document.createElement('div');
          overlay.className = 'overlay';
          overlay.innerHTML = `<div>${item.desc}</div>`;
          div.appendChild(name);
          div.appendChild(overlay);
          grid.appendChild(div);
        });
      }
      setupMobileTap();
    }

    // Only one tapped card at a time, tap toggles overlay on/off
    function setupMobileTap() {
      if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        document.querySelectorAll('.item').forEach(el => {
          el.removeEventListener('click', el._tapHandler, false);
          el._tapHandler = function(e) {
            // Remove overlays from all cards except this one
            document.querySelectorAll('.item.show-desc').forEach(card => {
              if (card !== el) card.classList.remove('show-desc');
            });
            // Toggle this card
            el.classList.toggle('show-desc');
          };
          el.addEventListener('click', el._tapHandler, false);
        });
        // Optional: Tap outside cards removes overlays
        document.addEventListener('touchstart', function(e) {
          const item = e.target.closest('.item');
          if (!item) {
            document.querySelectorAll('.item.show-desc').forEach(card => card.classList.remove('show-desc'));
          }
        });
      }
    }

    function prettyName(fn) {
      const small = /^(and|with|of|the|in|on|at|for|a|an|&)$/i;
      return fn.replace(/\.[^.]+$/, '')
        .replace(/_/g, ' ')
        .split(' ')
        .map((w, i) =>
          i === 0 || !small.test(w)
            ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()
            : w.toLowerCase())
        .join(' ')
        .replace(/&/g, '&');
    }

    render();
  });
</script>
</body>
</html>
