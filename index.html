<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Restaurant Menu Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
:root {
--bg: #FEF8EC;
--txt: #fff;
--accent: #e67e22;
--sec: #2980b9;
}
html, body {
margin: 0 !important;
padding: 0 !important;
width: 100vw;
min-width: 100vw;
max-width: 100vw;
overflow-x: hidden;
box-sizing: border-box;
background: var(--bg);
color: #222;
font-family: system-ui, sans-serif;
}
h1 {
text-align: center;
color: var(--accent);
margin: 1.5rem 0 .5rem 0;
}
.section-title {
font-size: 1.4rem;
color: var(--sec);
text-align: center;
margin: 2rem 0 1rem 0;
font-weight: 600;
padding: 0 8px;
}
.subtitle {
font-size: .9rem;
text-align: center;
color: #777;
margin-bottom: 1.5rem;
padding: 0 8px;
}
#filters {
display: flex;
flex-wrap: wrap;
gap: 10px;
justify-content: center;
margin: 1.5rem 0;
padding: 0 8px;
will-change: contents;
}
#filters label {
background: #fff;
padding: 6px 12px;
border-radius: 20px;
font-size: .85rem;
box-shadow: 0 1px 3px rgba(0, 0, 0, .1);
cursor: pointer;
user-select: none;
}
#filters input {
margin-right: 5px;
}
.grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
gap: 0;
max-width: 100vw;
margin: 0 auto;
padding: 0 4px;
box-sizing: border-box;
overflow-wrap: break-word;
}
.item {
position: relative;
width: 100%;
height: 0;
padding-bottom: 100%;
overflow: hidden;
background: #000;
cursor: pointer;
}
.item img {
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
object-fit: cover;
user-select: none;
border: 1px solid #E3D2B3;
border-radius: 6px;
transition: border-color 0.2s ease;
}
.item:hover img {
border-color: #d6c39a;
}

/* Title in upper-left with translucent background */
.name {
position: absolute;
top: 8px; left: 8px;
color: var(--txt);
background: rgba(0, 0, 0, 0.55);
padding: 6px 10px;
font-weight: 600;
text-align: left;
font-size: 1rem;
line-height: 1.3;
z-index: 2;
border-radius: 4px;
pointer-events: none;
transition: background 0.2s ease, text-shadow 0.2s ease;
-webkit-font-smoothing: antialiased;
text-rendering: optimizeLegibility;
}
.item:hover .name {
background: rgba(0, 0, 0, 0.65);
text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9);
}

/* Description remains centered */
.overlay {
position: absolute;
left: 50%;
top: 50%;
transform: translate(-50%, -50%);
width: 88%;
color: var(--txt);
font-size: 1.05rem;
font-weight: 600;
font-family: inherit;
text-align: center;
pointer-events: none;
opacity: 0;
transition: opacity 0.18s ease-out;
z-index: 10;
text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
padding: 6px;
white-space: pre-wrap;
word-break: break-word;
-webkit-font-smoothing: antialiased;
text-rendering: optimizeLegibility;
}

/* Show overlay on hover/tap */
.item.show-desc .overlay,
.item:hover .overlay {
opacity: 1;
pointer-events: auto;
transition: none;
}
.item.show-desc:not(:hover) .overlay {
transition: opacity 0.3s ease-out;
}

/* Responsive scaling adjustments */
@media (max-width: 600px) {
.grid {
grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
padding: 0 4px;
}
.name {
font-size: 1rem;
padding: 5px 8px;
}
.overlay {
font-size: 0.95rem;
}
#filters, .subtitle, .section-title, h1 {
margin-left: 0 !important;
margin-right: 0 !important;
padding-left: 0 !important;
padding-right: 0 !important;
}
}

.missing {
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
color: #aaa;
font-style: italic;
background: #111;
}
</style>
</head>
<body>
<h1>Restaurant Menu Gallery</h1>
<p class="subtitle">Tap or hover for description • Filter by tags</p>
<div id="filters"></div>
<div class="section-title">Small Plates & Snacks</div>
<div id="grid1" class="grid" aria-live="polite" aria-relevant="additions"></div>
<div class="section-title">Appetizers</div>
<div id="grid2" class="grid" aria-live="polite" aria-relevant="additions"></div>
<script>
const IMG_FOLDERS = {
small: 'i/01_(16)_Small_Plates_and_Snacks/',
appetizer: 'i/02_(25)_Appetizers/'
};
fetch('menu.json')
.then(resp => resp.json())
.then(data => {
const tagSet = new Set();
data.forEach(o => o.tags.forEach(t => tagSet.add(t)));
const tags = Array.from(tagSet).sort();
const filtersDiv = document.getElementById('filters');
tags.forEach(t => {
const lbl = document.createElement('label');
const cb = document.createElement('input');
cb.type = 'checkbox'; cb.dataset.tag = t;
cb.addEventListener('change', render);
lbl.appendChild(cb);
lbl.appendChild(document.createTextNode(t.charAt(0).toUpperCase() + t.slice(1)));
filtersDiv.appendChild(lbl);
});
function render() {
const excluded = new Set();
filtersDiv.querySelectorAll('input:checked').forEach(c => excluded.add(c.dataset.tag));
renderGrid('grid1', 'small', excluded);
renderGrid('grid2', 'appetizer', excluded);
setupMobileTap();
}
function renderGrid(gridId, section, excludedTags) {
const grid = document.getElementById(gridId);
const filteredItems = data.filter(
item => item.section === section && !item.tags.some(t => excludedTags.has(t))
);
const fragment = document.createDocumentFragment();
filteredItems.forEach(item => {
const div = document.createElement('div');
div.className = 'item';
div.tabIndex = 0;
const img = new Image();
img.alt = prettyName(item.file);
img.src = IMG_FOLDERS[section] + item.file;
img.style.visibility = 'hidden';
img.onload = () => img.style.visibility = 'visible';
img.onerror = () => {
const miss = document.createElement('div');
miss.className = 'missing';
miss.textContent = 'Image missing';
div.appendChild(miss);
};
div.appendChild(img);
const name = document.createElement('div');
name.className = 'name';
name.textContent = prettyName(item.file);
div.appendChild(name);
const overlay = document.createElement('div');
overlay.className = 'overlay';
overlay.textContent = item.desc;
div.appendChild(overlay);

// auto-scale overlay font if overlapping
requestAnimationFrame(() => {
const nameRect = name.getBoundingClientRect();
const overlayRect = overlay.getBoundingClientRect();
if (overlayRect.bottom > nameRect.top - 4) {
overlay.style.fontSize = '0.9rem';
}
});

fragment.appendChild(div);
});
grid.replaceChildren(fragment);
}
function setupMobileTap() {
if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
document.querySelectorAll('.item').forEach(el => {
el.removeEventListener('click', el._tapHandler);
el._tapHandler = function(e) {
document.querySelectorAll('.item.show-desc').forEach(card => {
if (card !== el) card.classList.remove('show-desc');
});
el.classList.toggle('show-desc');
};
el.addEventListener('click', el._tapHandler);
});
document.addEventListener('touchstart', e => {
const item = e.target.closest('.item');
if (!item) {
document.querySelectorAll('.item.show-desc').forEach(card => card.classList.remove('show-desc'));
}
});
}
}
function prettyName(fn) {
const small = /^(and|with|of|the|in|on|at|for|a|an|&)$/i;
return fn.replace(/\.[^.]+$/, '')
.replace(/_/g, ' ')
.split(' ')
.map((w, i) =>
i === 0 || !small.test(w)
? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()
: w.toLowerCase())
.join(' ')
.replace(/&/g, '&');
}
render();
})
.catch(e => {
console.error('Failed to load menu.json:', e);
});
</script>
</body>
</html>
