<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Restaurant Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
:root {
  --bg: #FEF8EC;
  --txt: #fff;
  --accent: #e67e22;
  --sec: #7B2E2F;
  --border: #e3d2b3;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
  background: var(--bg);
  color: #222;
  font-family: system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}

h1 {
  text-align: center;
  color: var(--accent);
  margin: 1.2rem 0 0.3rem;
  font-family: "Georgia", serif;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 20;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border);
}

.subtitle {
  text-align: center;
  color: #777;
  margin: 0.6rem 0 1rem;
  padding: 0 8px;
  font-size: .9rem;
}

/* FILTERS */
#filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  padding: 0 8px 1rem;
  margin: 0 auto;
  max-width: 100vw;
}

#filters label {
  background: #fff;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: .85rem;
  box-shadow: 0 1px 2px rgba(0,0,0,.1);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition: transform .1s;
}

#filters label:active { transform: scale(0.95); }

#filters input { margin-right: 5px; }

/* SECTION - Critical: NO contain, NO overflow */
.section {
  padding-top: 1px; /* Prevents margin collapse */
  margin-bottom: 2rem;
}

/* STICKY HEADER - Pure, GPU-friendly */
.section-title {
  position: sticky;
  top: 0;
  background: var(--bg);
  color: var(--sec);
  font-size: 1.25rem;
  font-weight: 600;
  font-family: "Georgia", serif;
  text-align: center;
  margin: 0;
  padding: 0.75rem 8px 0.65rem;
  border-bottom: 1px solid var(--border);
  z-index: 10;
  /* NO box-shadow, NO backdrop-filter */
  line-height: 1.2;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px;
  padding: 0 8px;
  contain: layout style;
  content-visibility: auto;
  contain-intrinsic-size: 210px 210px;
}

.item {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 10px;
  overflow: hidden;
  background: var(--bg);
  cursor: pointer;
  contain: layout style paint;
}

.item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border: 1px solid var(--border);
  border-radius: 10px;
  transition: border-color .2s ease;
  loading: lazy;
  decoding: async;
}

.item:hover img,
.item.show-desc img {
  border-color: #d6c39a;
}

/* NAME BADGE */
.name {
  position: absolute;
  top: 6px;
  left: 6px;
  background: rgba(145, 100, 50, 0.8);
  color: white;
  padding: 4px 10px;
  font-weight: 600;
  font-size: 1rem;
  border-radius: 6px;
  max-width: calc(100% - 16px);
  white-space: normal;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
  z-index: 2;
  pointer-events: none;
  line-height: 1.3;
}

/* SUBTITLE DESCRIPTION - Bottom only, instant in */
.overlay {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 16px 10px 10px;
  background: linear-gradient(transparent, rgba(145, 100, 50, 0.8) 40%);
  color: white;
  font-family: "Georgia", serif;
  font-size: 0.95rem;
  font-weight: 500;
  text-align: center;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
  opacity: 0;
  transition: opacity 0.35s ease-out;
  pointer-events: none;
  z-index: 2;
  max-height: 60%;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

/* INSTANT SHOW */
.item:hover .overlay,
.item.show-desc .overlay {
  opacity: 1;
  transition: none;
}

/* Responsive */
@media (max-width: 600px) {
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 7px;
    contain-intrinsic-size: 150px 150px;
  }
  .name {
    font-size: 0.95rem;
    padding: 3px 8px;
    top: 5px;
    left: 5px;
    border-radius: 5px;
  }
  .overlay {
    font-size: 0.9rem;
    padding: 14px 8px 8px;
  }
  .section-title {
    font-size: 1.2rem;
    padding: 0.7rem 8px 0.6rem;
  }
}

/* Missing */
.missing {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  font-style: italic;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
}
</style>
</head>
<body>

<h1>Restaurant Menu Gallery</h1>
<p class="subtitle">Tap or hover for description • Filter by tags</p>
<div id="filters"></div>

<div class="section">
  <h2 class="section-title">Small Plates & Snacks</h2>
  <div id="grid1" class="grid"></div>
</div>

<div class="section">
  <h2 class="section-title">Appetizers</h2>
  <div id="grid2" class="grid"></div>
</div>

<script>
const IMG_FOLDERS = {
  small: 'i/01_(16)_Small_Plates_and_Snacks/',
  appetizer: 'i/02_(25)_Appetizers/'
};

let data = [], filtersDiv;

fetch('menu.json')
  .then(r => r.json())
  .then(items => {
    data = items;
    buildFilters();
    render();
  });

function buildFilters() {
  const tags = [...new Set(data.flatMap(i => i.tags))].sort();
  filtersDiv = document.getElementById('filters');
  tags.forEach(tag => {
    const label = Object.assign(document.createElement('label'), {
      innerHTML: `<input type="checkbox" checked data-tag="${tag}"> ${tag.charAt(0).toUpperCase() + tag.slice(1)}`
    });
    label.querySelector('input').addEventListener('change', debounce(render, 60));
    filtersDiv.appendChild(label);
  });
}

function render() {
  const hidden = new Set(
    [...filtersDiv.querySelectorAll('input:not(:checked'))].map(i => i.dataset.tag)
  );
  renderGrid('grid1', 'small', hidden);
  renderGrid('grid2', 'appetizer', hidden);
  setupTap();
}

function renderGrid(id, section, hidden) {
  const grid = document.getElementById(id);
  const items = data.filter(i => i.section === section && !i.tags.some(t => hidden.has(t)));
  const frag = document.createDocumentFragment();
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <img src="${IMG_FOLDERS[section] + item.file}" alt="${pretty(item.file)}" loading="lazy" decoding="async">
      <div class="name">${pretty(item.file)}</div>
      <div class="overlay">${item.desc}</div>
    `;
    frag.appendChild(div);
  });
  grid.replaceChildren(frag);
}

function setupTap() {
  if (!/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return;
  document.querySelectorAll('.item').forEach(el => {
    el.onclick = e => {
      e.preventDefault();
      const active = el.classList.contains('show-desc');
      document.querySelectorAll('.show-desc').forEach(x => x.classList.remove('show-desc'));
      if (!active) el.classList.add('show-desc');
    };
  });
}

function debounce(fn, wait) {
  let t;
  return () => {
    clearTimeout(t);
    t = setTimeout(fn, wait);
  };
}

function pretty(fn) {
  return fn.replace(/\.[^.]+$/, '').replace(/_/g, ' ')
    .replace(/\b\w/g, (l, i) => i === 0 || !/^(and|with|of|the|in|on|at|for|a|an)$/i.test(l) ? l.toUpperCase() : l.toLowerCase())
    .replace(/&/g, '&');
}
</script>
</body>
</html>
