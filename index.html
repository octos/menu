<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Menu Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --bg: #fafafa;
  --txt: #fff;
  --accent: #e67e22;
  --sec: #2980b9;
}
html, body {
  margin: 0 !important;
  padding: 0 !important;
  width: 100vw;
  min-width: 100vw;
  max-width: 100vw;
  overflow-x: hidden; /* Prevent horizontal scroll */
  box-sizing: border-box;
  background: var(--bg);
  color: #222;
  font-family: system-ui, sans-serif;
}
h1 {
  text-align: center;
  color: var(--accent);
  margin: 1.5rem 0 .5rem 0;
}
.section-title {
  font-size: 1.4rem;
  color: var(--sec);
  text-align: center;
  margin: 2rem 0 1rem 0;
  font-weight: 600;
  padding: 0 8px; /* small padding to avoid flush edges */
}
.subtitle {
  font-size: .9rem;
  text-align: center;
  color: #777;
  margin-bottom: 1.5rem;
  padding: 0 8px;
}
#filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin: 1.5rem 0;
  padding: 0 8px;
  will-change: contents; /* hint to browser to optimize filter container */
}
#filters label {
  background: #fff;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: .85rem;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .1);
  cursor: pointer;
  user-select: none;
  /* prevent flicker by avoiding layout thrashing */
  backface-visibility: hidden;
  transform-style: preserve-3d;
}
#filters input {
  margin-right: 5px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 0;
  max-width: 100vw;
  margin: 0 auto;
  padding: 0 4px; /* Add small side padding to limit overlap */
  box-sizing: border-box;
  overflow-wrap: break-word;
}
.item {
  position: relative;
  width: 100%;
  height: 0;
  padding-bottom: 100%;
  overflow: visible; /* allow overlay to extend beyond */
  background: #000;
}
.item img {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  user-select: none;
}
.name {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
  color: var(--txt);
  padding: 30px 12px 12px;
  font-weight: 600;
  text-align: center;
  font-size: 1.05rem;
  line-height: 1.3;
  z-index: 2;
  pointer-events:none;
  word-break: break-word;
  min-height: 3.2em; /* Ensures space for two lines */
}
.overlay {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  min-width: 60%;
  max-width: 90%;
  padding: 22px 19px;
  border-radius: 18px;
  background: rgba(24, 24, 24, 0.75); /* lighter background (less hiding) */
  color: var(--txt);
  font-size: 1.05rem; /* same as .name font size */
  font-weight: 600;   /* match title font weight */
  font-family: inherit; /* inherit same font family */
  text-align: center;
  pointer-events: none;
  box-shadow: 0 6px 32px 8px rgba(0, 0, 0, 0.16);
  opacity: 0;
  transition: opacity 0.3s ease-out;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: pre-wrap;
  word-break: break-word;
}
/* Show overlay instantly (no fade-in) */
.item.show-desc .overlay {
  opacity: 1;
  pointer-events: auto;
  transition: none;
}
/* Fade out overlay with transition */
.item:not(.show-desc) .overlay {
  transition: opacity 0.3s ease-out;
}

@media (max-width: 600px) {
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    padding: 0 4px;
  }
  .name {
    font-size: 1rem;
    padding: 24px 8px 10px;
    min-height: 3em;
  }
  #filters, .subtitle, .section-title, h1 {
    margin-left: 0 !important;
    margin-right: 0 !important;
    padding-left: 0 !important;
    padding-right: 0 !important;
  }
}
.missing {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  font-style: italic;
  background: #111;
}
</style>
</head>
<body>
<h1>Restaurant Menu Gallery</h1>
<p class="subtitle">Tap or hover for description • Filter by tags</p>
<div id="filters"></div>
<div class="section-title">Small Plates & Snacks</div>
<div id="grid1" class="grid" aria-live="polite" aria-relevant="additions"></div>
<div class="section-title">Appetizers</div>
<div id="grid2" class="grid" aria-live="polite" aria-relevant="additions"></div>

<script>
const IMG_FOLDERS = {
  small: 'i/01_(16)_Small_Plates_and_Snacks/',
  appetizer: 'i/02_(25)_Appetizers/'
};

fetch('menu.json')
  .then(resp => resp.json())
  .then(data => {
    const tagSet = new Set();
    data.forEach(o => o.tags.forEach(t => tagSet.add(t)));
    const tags = Array.from(tagSet).sort();

    const filtersDiv = document.getElementById('filters');
    tags.forEach(t => {
      const lbl = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.dataset.tag = t;
      cb.addEventListener('change', render);
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(t.charAt(0).toUpperCase() + t.slice(1)));
      filtersDiv.appendChild(lbl);
    });

    function render() {
      const excluded = new Set();
      filtersDiv.querySelectorAll('input:checked').forEach(c => excluded.add(c.dataset.tag));

      // Render in place without clearing grids first to prevent flicker:
      // Update items selectively.

      renderGrid('grid1', 'small', excluded);
      renderGrid('grid2', 'appetizer', excluded);
      setupMobileTap();
    }

    // Render grid without full innerHTML clears to avoid flicker:
    // Instead, rebuild minimal DOM efficiently.
    function renderGrid(gridId, section, excludedTags) {
      const grid = document.getElementById(gridId);

      // Filtered items
      const filteredItems = data.filter(
        item => item.section === section && !item.tags.some(t => excludedTags.has(t))
      );

      // Create a DocumentFragment for batch appending (better perf)
      const fragment = document.createDocumentFragment();

      filteredItems.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item';
        div.tabIndex = 0;
        const img = new Image();
        img.alt = prettyName(item.file);
        img.src = IMG_FOLDERS[section] + item.file;
        img.onload = () => img.style.visibility = "visible";
        img.onerror = () => {
          const miss = document.createElement('div');
          miss.className = 'missing';
          miss.textContent = 'Image missing';
          div.appendChild(miss);
        };
        img.style.visibility = 'hidden'; // prevent flicker before load
        div.appendChild(img);

        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = prettyName(item.file);
        div.appendChild(name);

        const overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.textContent = item.desc;
        div.appendChild(overlay);

        fragment.appendChild(div);
      });

      // Replace children all at once to reduce flicker
      grid.replaceChildren(fragment);
    }

    function setupMobileTap() {
      if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        document.querySelectorAll('.item').forEach(el => {
          el.removeEventListener('click', el._tapHandler);
          el._tapHandler = function(e) {
            // Close others
            document.querySelectorAll('.item.show-desc').forEach(card => {
              if (card !== el) card.classList.remove('show-desc');
            });
            // Toggle this
            el.classList.toggle('show-desc');
          };
          el.addEventListener('click', el._tapHandler);
        });

        document.addEventListener('touchstart', e => {
          const item = e.target.closest('.item');
          if (!item) {
            document.querySelectorAll('.item.show-desc').forEach(card => card.classList.remove('show-desc'));
          }
        });
      }
    }

    function prettyName(fn) {
      const small = /^(and|with|of|the|in|on|at|for|a|an|&)$/i;
      return fn.replace(/\.[^.]+$/, '')
        .replace(/_/g, ' ')
        .split(' ')
        .map((w, i) =>
          i === 0 || !small.test(w)
            ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()
            : w.toLowerCase())
        .join(' ')
        .replace(/&/g, '&');
    }

    render();
  })
  .catch(e => {
    console.error('Failed to load menu.json:', e);
  });
</script>
</body>
</html>
